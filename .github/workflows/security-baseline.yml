name: Security baseline
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-baseline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tracked-file-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test the security check
        run: python3 scripts/security-baseline.test.py
      - name: Check tracked credential files and selected secret signatures
        run: python3 scripts/security-baseline.py
